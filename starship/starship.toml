add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$character
"""

[directory]
truncate_to_repo = false
style = "bold blue"

[git_branch]
symbol = " "
style = "bold lavender"

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 1000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
